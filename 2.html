<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #0f172a; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background-color: #1e293b;
            padding: 40px 30px;
            width: 320px;
            border-radius: 16px;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .login-box h2 {
            color: #f8fafc; 
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8; 
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #334155; 
            color: #ffffff; 
            border: 1px solid #475569;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #6366f1; 
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #4f46e5; 
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login</h2>
        <form>
            <div class="input-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password">
            </div>

            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
